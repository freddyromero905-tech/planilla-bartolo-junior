<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Planilla Bartolo" />
  <title>Bartolo Junior - Planilla Digital Online</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --ink: #171717;
      --muted: #616161;
      --line: #d9dde3;
      --dark: #111111;
      --accent: #b91c1c;
      --accent-soft: #fee2e2;
      --ok: #166534;
      --ok-soft: #dcfce7;
      --warn: #92400e;
      --warn-soft: #fef3c7;
      --blue: #1d4ed8;
      --blue-soft: #dbeafe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      background: var(--dark);
      color: #fff;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
    }

    .topbar h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    .topbar p {
      margin: 6px 0 0;
      color: #d4d4d4;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .badge {
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .panel-body {
      padding: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .wide-field,
    .span-2 {
      grid-column: span 2;
    }

    label {
      display: block;
      color: var(--ink);
      font-weight: 700;
    }

    label span {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
    }

    input,
    select {
      width: 100%;
      min-height: 38px;
      border: 1px solid #cdd3db;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }

    input:focus,
    select:focus,
    button:focus {
      outline: 2px solid rgba(29, 78, 216, 0.32);
      outline-offset: 2px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .tab {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px;
    }

    .tab.active {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
    }

    .section-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .section-title p {
      margin: 4px 0 0;
      color: var(--muted);
      line-height: 1.35;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid #eceff3;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #e8ecf1;
      color: #222;
      font-size: 12px;
      text-transform: uppercase;
    }

    tfoot td {
      background: #f7f8fa;
      font-weight: 800;
    }

    td input,
    td select {
      min-width: 96px;
    }

    .narrow {
      width: 110px;
    }

    .row-actions {
      width: 64px;
      text-align: center;
    }

    .btn {
      border: 1px solid var(--dark);
      border-radius: 8px;
      min-height: 38px;
      padding: 8px 12px;
      background: var(--dark);
      color: #fff;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }

    .btn.danger {
      background: #fff;
      color: var(--accent);
      border-color: #fecaca;
      width: 36px;
      min-height: 34px;
      padding: 0;
    }

    .notice {
      border-radius: 8px;
      padding: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .notice.red {
      background: var(--accent-soft);
      color: #7f1d1d;
    }

    .notice.amber {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .notice.green {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .inline-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .summary-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 16px;
    }

    .summary-box h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid #eceff3;
    }

    .summary-row b {
      white-space: nowrap;
    }

    .final-total {
      margin-top: 14px;
      border-radius: 8px;
      background: var(--dark);
      color: #fff;
      padding: 16px;
    }

    .final-total p {
      margin: 0;
      color: #d4d4d4;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .final-total strong {
      display: block;
      margin-top: 5px;
      font-size: 34px;
      line-height: 1.1;
    }

    .final-total.alert {
      background: var(--accent);
    }

    .final-total.ok {
      background: var(--ok);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .kpi {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
    }

    .kpi .icon {
      color: var(--muted);
      font-size: 22px;
    }

    .kpi p {
      margin: 8px 0 4px;
      color: var(--muted);
    }

    .kpi strong {
      display: block;
      font-size: 18px;
      word-break: break-word;
    }

    .sales-kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .sales-kpi {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 14px;
    }

    .sales-kpi p {
      margin: 0 0 6px;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 12px;
    }

    .sales-kpi strong {
      display: block;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.1;
      word-break: break-word;
    }

    .sales-kpi.total {
      background: var(--dark);
      border-color: var(--dark);
      color: #fff;
    }

    .sales-kpi.total p {
      color: #f8d250;
    }

    .sales-kpi.total strong {
      color: #fff;
      font-size: 30px;
    }

    .category-picker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .category-chip {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      min-height: 62px;
      padding: 10px 12px;
      text-align: left;
      font-weight: 900;
    }

    .category-chip span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .category-chip.active {
      background: var(--dark);
      border-color: var(--dark);
      color: #fff;
    }

    .category-chip.active span {
      color: #f8d250;
    }

    .local-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .local-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }

    .local-card p {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .menu-card {
      width: 100%;
      min-height: 116px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .menu-card strong {
      display: block;
      font-size: 20px;
      line-height: 1.15;
    }

    .menu-card span {
      color: var(--muted);
      font-weight: 700;
      line-height: 1.25;
    }

    .menu-card .menu-code {
      color: var(--accent);
      font-size: 13px;
      text-transform: uppercase;
    }

    .section-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .section-nav strong {
      font-size: 18px;
    }

    .hidden {
      display: none;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .right {
      text-align: right;
    }

    @media (max-width: 920px) {
      body {
        font-size: 15px;
      }

      input,
      select,
      button {
        font-size: 16px;
      }

      .app {
        max-width: none;
        padding: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        border-radius: 10px;
        padding: 14px;
      }

      .badges {
        justify-content: flex-start;
        width: 100%;
      }

      .badges .btn {
        flex: 1 1 150px;
      }

      .badges .btn.danger {
        flex: 0 0 52px;
        width: 52px;
      }

      .form-grid,
      .inline-grid,
      .two-col,
      .kpi-grid,
      .local-grid,
      .menu-grid {
        grid-template-columns: 1fr;
      }

      .wide-field,
      .span-2 {
        grid-column: auto;
      }

      .panel {
        margin-top: 10px;
        border-radius: 10px;
      }

      .section-nav {
        margin: 10px -2px 0;
      }

      .section-nav .btn {
        flex: 0 0 auto;
      }

      .menu-card {
        min-height: 96px;
      }

      .panel-body {
        padding: 12px;
      }

      .section-title {
        flex-direction: column;
      }

      .section-title > div,
      .section-title .btn {
        width: 100%;
      }

      .table-wrap {
        overflow: visible;
        border: 0;
        background: transparent;
      }

      .table-wrap table,
      .table-wrap thead,
      .table-wrap tbody,
      .table-wrap tfoot,
      .table-wrap tr,
      .table-wrap td {
        display: block;
        width: 100%;
        min-width: 0;
      }

      .table-wrap thead {
        display: none;
      }

      .table-wrap tr {
        margin-bottom: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        padding: 10px;
      }

      .table-wrap td {
        border-bottom: 0;
        padding: 7px 0;
        display: grid;
        grid-template-columns: minmax(112px, 42%) minmax(0, 1fr);
        gap: 10px;
        align-items: center;
      }

      .table-wrap td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .table-wrap td:not([data-label]) {
        display: block;
      }

      .table-wrap td:not([data-label])::before {
        content: "";
        display: none;
      }

      .table-wrap tfoot tr {
        background: #111;
        color: #fff;
      }

      .table-wrap tfoot td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: inherit;
        font-weight: 800;
      }

      .table-wrap tfoot td::before {
        display: none;
      }

      td input,
      td select,
      .narrow {
        width: 100%;
        min-width: 0;
      }

      .row-actions {
        width: 100%;
        text-align: left;
      }

      .row-actions .btn {
        width: 100%;
      }

      .summary-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .summary-row b {
        white-space: normal;
        font-size: 18px;
      }
    }

    @media (max-width: 520px) {
      .app {
        padding: 8px;
      }

      .topbar {
        margin: -8px -8px 0;
        border-radius: 0 0 12px 12px;
      }

      .topbar h1 {
        font-size: 20px;
      }

      .topbar p {
        font-size: 13px;
      }

      .form-grid {
        gap: 10px;
      }

      .final-total {
        padding: 14px;
      }

      .final-total strong {
        font-size: 28px;
      }
    }
  </style>
</head>

    function normalizeLocalName(local) {
      const text = String(local || "");
      if (!text) return "Ñu Guazú";
      const compact = text.toLowerCase();
      if (compact.includes("guaz")) return "Ñu Guazú";
      if (compact.includes("marambur")) return "Maramburé";
      if (compact.includes("ciclov")) return "Ciclovía";
      if (compact.includes("costanera")) return "Costanera";
      return locales.includes(text) ? text : "Ñu Guazú";
    }

    function migrateLocalMap(map, factory) {
      const migrated = {};
      Object.entries(map || {}).forEach(([local, value]) => {
        const cleanLocal = normalizeLocalName(local);
        migrated[cleanLocal] = { ...(migrated[cleanLocal] || factory(cleanLocal)), ...(value || {}) };
      });
      return migrated;
    }

    function migrateDayMap(map) {
      const migrated = {};
      Object.entries(map || {}).forEach(([key, value]) => {
        const [local, ...dateParts] = String(key).split("__");
        const date = dateParts.join("__") || value?.fecha || today();
        migrated[dayKey(normalizeLocalName(local), date)] = value;
      });
      return migrated;
    }

    let state = loadState();
    adminFechaDesde = state.fecha || today();
    adminFechaHasta = state.fecha || today();

    function unwrapStoredState(payload) {
      if (!payload || typeof payload !== "object") return null;
      return payload.state && typeof payload.state === "object" ? payload.state : payload;
    }

    function scoreStoredState(candidate) {
      if (!candidate || typeof candidate !== "object") return -1;
      const securityPins = Object.values(candidate.seguridad?.sucursales || {}).filter((row) => String(row?.pin || "").trim()).length;
      const dayCount = Object.keys(candidate.sucursalDias || {}).length;
      const reportCount = Object.keys(candidate.reportesPorFecha || {}).length;
      const closedCount = Object.values(candidate.cierres || {}).filter((row) => row?.cerrado).length;
      const salesCount = (candidate.ventas || []).reduce((acc, row) => acc + Number(row?.cantidad || 0), 0);
      const stockMoves = ["carnes", "extras", "quesos", "jamones", "bebidas"].reduce((acc, key) => {
        return acc + (candidate[key] || []).filter((row) =>
          Number(row?.inicial || 0) || Number(row?.entrada || 0) || Number(row?.saldo || 0)
        ).length;
      }, 0);
      const adminPinChanged = candidate.seguridad?.adminPin && String(candidate.seguridad.adminPin) !== "4000" ? 25 : 0;
      return securityPins * 100 + dayCount * 20 + reportCount * 20 + closedCount * 50 + salesCount + stockMoves + adminPinChanged;
    }

    function readStoredState() {
      const keys = [storageKey, storageBackupKey, ...legacyStorageKeys];
      const candidates = [];
      keys.forEach((key) => {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return;
          const parsed = unwrapStoredState(JSON.parse(raw));
          if (parsed) candidates.push({ key, state: parsed, score: scoreStoredState(parsed) });
        } catch {
          // Ignore broken local snapshots and keep looking for the stable memory copy.
        }
      });
      candidates.sort((a, b) => b.score - a.score);
      return candidates[0]?.state || null;
    }

    function writeStoredState(nextState) {
      const serialized = JSON.stringify(nextState);
      const backup = JSON.stringify({
        type: "bartolo-junior-planilla-stable-memory",
        version: "1.1",
        savedAt: new Date().toISOString(),
        state: nextState
      });
      localStorage.setItem(storageKey, serialized);
      localStorage.setItem(storageBackupKey, backup);
    }

    function loadState() {
      try {
        const saved = readStoredState();
        const loadedState = normalizeState(saved ? { ...defaultState(), ...saved } : defaultState());
        writeStoredState(loadedState);
        return loadedState;
      } catch {
        return normalizeState(defaultState());
      }
    }

    function normalizeState(next) {
      const defaults = defaultState();
      next.local = normalizeLocalName(next.local);
      const savedExtras = next.extras;
      next.carnes = syncStockRows(next.carnes, stockCarnesPanes);
      next.extras = syncStockRows(next.extras, stockExtras);
      next.quesos = syncStockRows(next.quesos, stockQuesos, savedExtras);
      next.jamones = syncStockRows(next.jamones, stockJamones, savedExtras);
      next.bebidas = syncStockRows(next.bebidas, stockBebidas);
      next.ventas = syncVentas(next.ventas);
      next.productosArmados = syncProductosArmados(next.productosArmados);
      next.consumosInternos = syncConsumosInternos(next.consumosInternos);
      next.cierres = { ...defaults.cierres, ...migrateLocalMap(next.cierres, defaultCierre) };
      locales.forEach((local) => {
        next.cierres[local] = { ...defaultCierre(), ...(next.cierres[local] || {}) };
      });
      next.reportesSucursales = { ...defaults.reportesSucursales, ...migrateLocalMap(next.reportesSucursales, defaultReporteSucursal) };
      locales.forEach((local) => {
        next.reportesSucursales[local] = { ...defaultReporteSucursal(local), ...(next.reportesSucursales[local] || {}) };
      });
      next.reportesPorFecha = migrateDayMap(next.reportesPorFecha || {});
      locales.forEach((local) => {
        const legacy = next.reportesSucursales[local];
        if (legacy?.fecha) {
          next.reportesPorFecha[reportKey(local, legacy.fecha)] = {
            ...defaultReporteSucursal(local),
            ...legacy
          };
        }
      });
      next.sucursalDias = migrateDayMap(next.sucursalDias || {});
      const currentDayKey = dayKey(next.local, next.fecha);
      if (!next.sucursalDias[currentDayKey]) {
        next.sucursalDias[currentDayKey] = buildDailyDataFrom(next);
      } else {
        applyDailyDataTo(next, next.sucursalDias[currentDayKey]);
      }
      next.totalPYManual = Number(next.totalPYManual || 0);
      next.comisionPY = 0;
      next.seguridad = {
        ...defaultSeguridad(),
        ...(next.seguridad || {}),
        sucursales: {
          ...defaultSeguridad().sucursales,
          ...migrateLocalMap((next.seguridad || {}).sucursales, () => ({ encargado: "", pin: "", activo: true }))
        }
      };
      locales.forEach((local) => {
        next.seguridad.sucursales[local] = {
          encargado: "",
          pin: "",
          activo: true,
          ...(next.seguridad.sucursales[local] || {})
        };
      });
      next.acceso = { ...defaultAcceso(), ...(next.acceso || {}) };
      if (next.acceso.tipo === "encargado") {
        next.acceso.local = normalizeLocalName(next.acceso.local);
        next.local = next.acceso.local || next.local;
        const accessDayKey = dayKey(next.local, next.fecha);
        if (!next.sucursalDias[accessDayKey]) {
          next.sucursalDias[accessDayKey] = zeroDailyData(next.fecha);
        }
        applyDailyDataTo(next, next.sucursalDias[accessDayKey]);
      }
      return next;
    }

    function syncStockRows(savedRows, officialItems, fallbackRows = []) {
      const allRows = [
        ...(Array.isArray(savedRows) ? savedRows : []),
        ...(Array.isArray(fallbackRows) ? fallbackRows : [])
      ];
      const byProduct = new Map(allRows.map((row) => [row.producto, row]));
      return officialItems.map((producto) => ({
        inicial: 0,
        entrada: 0,
        saldo: 0,
        ...(byProduct.get(producto) || {}),
        producto
      }));
    }

    function dayKey(local, fecha) {
      return `${local || ""}__${fecha || today()}`;

    function reportKey(local, fecha) {

    function zeroDailyData(fecha) {
      return {
        encargado: "",

    function buildDailyDataFrom(source) {
      const local = source.local;
      return {
        encargado: source.encargado || "",
        carnes: syncStockRows(source.carnes, stockCarnesPanes),
        extras: syncStockRows(source.extras, stockExtras),
        quesos: syncStockRows(source.quesos, stockQuesos),
        jamones: syncStockRows(source.jamones, stockJamones),
        bebidas: syncStockRows(source.bebidas, stockBebidas),
        ventas: syncVentas(source.ventas),
        productosArmados: syncProductosArmados(source.productosArmados),
        consumosInternos: syncConsumosInternos(source.consumosInternos),
        pedidosYa: Array.isArray(source.pedidosYa) ? source.pedidosYa : [],
        efectivo: Number(source.efectivo || 0),
        qr: Number(source.qr || 0),
        totalPYManual: Number(source.totalPYManual || 0),
        comisionPY: 0,
        egresos: Array.isArray(source.egresos) ? source.egresos : zeroEgresos(),
        firmaEncargado: source.firmaEncargado || "",
        firmaVerificacion: source.firmaVerificacion || "",
        cierre: { ...defaultCierre(), fecha: source.fecha, ...(source.cierres?.[local] || {}) }
      };
    }

    function applyDailyDataTo(target, dayData) {
      const daily = dayData || zeroDailyData(target.fecha);
      target.encargado = daily.encargado || "";
      target.carnes = syncStockRows(daily.carnes, stockCarnesPanes);
      target.extras = syncStockRows(daily.extras, stockExtras);
      target.quesos = syncStockRows(daily.quesos, stockQuesos);
      target.jamones = syncStockRows(daily.jamones, stockJamones);
      target.bebidas = syncStockRows(daily.bebidas, stockBebidas);
      target.ventas = syncVentas(daily.ventas);
      target.productosArmados = syncProductosArmados(daily.productosArmados);
      target.consumosInternos = syncConsumosInternos(daily.consumosInternos);
      target.pedidosYa = Array.isArray(daily.pedidosYa) ? daily.pedidosYa : [];
      target.efectivo = Number(daily.efectivo || 0);
      target.qr = Number(daily.qr || 0);
      target.totalPYManual = Number(daily.totalPYManual || 0);
      target.comisionPY = 0;
      target.egresos = Array.isArray(daily.egresos) ? daily.egresos : zeroEgresos();
      target.firmaEncargado = daily.firmaEncargado || "";
      target.firmaVerificacion = daily.firmaVerificacion || "";
      target.cierres[target.local] = { ...defaultCierre(), fecha: target.fecha, ...(daily.cierre || {}) };
    }

    function persistCurrentDay() {
      if (!state?.sucursalDias) return;
      state.sucursalDias[dayKey(state.local, state.fecha)] = buildDailyDataFrom(state);
    }

    function loadCurrentDay() {
      const key = dayKey(state.local, state.fecha);
      if (!state.sucursalDias[key]) {
        state.sucursalDias[key] = zeroDailyData(state.fecha);
      }
      applyDailyDataTo(state, state.sucursalDias[key]);
    }

    function changeDayContext(field, value) {
      persistCurrentDay();
      queueCloudDay(state.local, state.fecha);
      state[field] = value;
      loadCurrentDay();
      saveState();
      render();
    }

    function saveState() {
      persistCurrentDay();
      writeStoredState(state);
      queueCloudStateForSync();
    }

    function setCloudStatus(status, storage = cloudStorage) {
      cloudStatus = status;
      cloudStorage = storage || cloudStorage;
      const badge = root.querySelector("[data-cloud-status]");
      if (badge) badge.textContent = cloudStatus;
    }

    function queueCloudRecord(record) {
      if (!record?.key) return;
      cloudPendingRecords.set(record.key, record);
    }

    function queueCloudDay(local, fecha) {
      const key = dayKey(local, fecha);
      const dayData = state.sucursalDias?.[key];
      if (!dayData) return;
      queueCloudRecord({
        key: `day::${key}`,
        type: "day",
        data: { local, fecha, dayData }
      });
    }

    function queueCloudReport(report) {
      if (!report?.local || !report?.fecha) return;
      queueCloudRecord({
        key: `report::${reportKey(report.local, report.fecha)}`,
        type: "report",
        data: { local: report.local, fecha: report.fecha, report }
      });
    }

    function queueCloudStateForSync() {
      queueCloudRecord({
        key: "config::security",
        type: "config",
        data: { seguridad: state.seguridad }
      });
      queueCloudDay(state.local, state.fecha);
      const report = state.reportesPorFecha?.[reportKey(state.local, state.fecha)];
      if (report) queueCloudReport(report);
      scheduleCloudSync();
    }

    function queueAllCloudState() {
      queueCloudRecord({
        key: "config::security",
        type: "config",
        data: { seguridad: state.seguridad }
      });
      Object.entries(state.sucursalDias || {}).forEach(([key, dayData]) => {
        const [local, ...dateParts] = key.split("__");
        const fecha = dateParts.join("__");
        queueCloudRecord({
          key: `day::${key}`,
          type: "day",
          data: { local, fecha, dayData }
        });
      });
      Object.values(state.reportesPorFecha || {}).forEach(queueCloudReport);
    }

    function scheduleCloudSync() {
      if (!cloudReady || !cloudPendingRecords.size) return;
      clearTimeout(cloudSyncTimer);
      setCloudStatus("Cambios pendientes");
      cloudSyncTimer = setTimeout(syncCloudNow, 800);
    }

    async function syncCloudNow() {
      if (!cloudReady || !cloudPendingRecords.size) return;
      const records = [...cloudPendingRecords.values()];
      records.forEach((record) => cloudPendingRecords.delete(record.key));
      setCloudStatus("Guardando online...");
      try {
        const response = await fetch("/api/sync", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ records })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const label = payload.storage === "postgres" ? "Online guardado" : "Servidor sin base permanente";
        setCloudStatus(label, payload.storage || "");
        if (cloudPendingRecords.size) scheduleCloudSync();
      } catch {
        records.forEach(queueCloudRecord);
        setCloudStatus("Sin conexion - guardado local");
      }
    }

    async function loadCloudState() {
      setCloudStatus("Sincronizando...");
      try {
        const response = await fetch("/api/sync", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const records = Array.isArray(payload.records) ? payload.records : [];

        records.forEach((record) => {
          const data = record.data || {};
          if (record.type === "config" && data.seguridad) {
            state.seguridad = {
              ...defaultSeguridad(),
              ...data.seguridad,
              sucursales: {
                ...defaultSeguridad().sucursales,
                ...(data.seguridad.sucursales || {})
              }
            };
          }
          if (record.type === "day" && data.local && data.fecha && data.dayData) {
            state.sucursalDias[dayKey(normalizeLocalName(data.local), data.fecha)] = data.dayData;
          }
          if (record.type === "report" && data.report?.local && data.report?.fecha) {
            const report = data.report;
            state.reportesPorFecha[reportKey(report.local, report.fecha)] = report;
            const current = state.reportesSucursales[report.local];
            if (!current?.fecha || report.fecha >= current.fecha) {
              state.reportesSucursales[report.local] = report;
            }
          }
        });

        loadCurrentDay();
        writeStoredState(state);
        cloudReady = true;
        setCloudStatus(payload.storage === "postgres" ? "Online sincronizado" : "Servidor sin base permanente", payload.storage || "");
        render();
        queueAllCloudState();
        scheduleCloudSync();
      } catch {
        cloudReady = false;
        setCloudStatus("Sin conexion - datos locales");
        render();
      }
    }

    function toNumber(value) {
      const next = Number(value);
      return Number.isFinite(next) ? next : 0;
    }

    function productById(id) {
      return productos.find((producto) => producto.id === id) || productos[0];
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function resumen() {
      const totalVentasPlanilla = state.ventas.reduce((acc, venta) => {
        const producto = productById(venta.productoId);
        return acc + producto.precio * Number(venta.cantidad || 0);
      }, 0);

      const totalProductosArmados = state.productosArmados.reduce((acc, row) => {
        return acc + Number(row.precio || 0) * Number(row.cantidad || 0);
      }, 0);

      const totalVentasLocal = totalVentasPlanilla + totalProductosArmados;

      const pyLista = state.pedidosYa.reduce((acc, pedido) => {
        const producto = productById(pedido.productoId);
        return acc + producto.precio * Number(pedido.cantidad || 0);
      }, 0);

      const pyManual = Number(state.totalPYManual || 0);
      const pyBruto = pyManual > 0 ? pyManual : pyLista;
      const pyComision = 0;
      const pyNeto = pyBruto;
      const totalEgresos = state.egresos.reduce((acc, egreso) => acc + Number(egreso.monto || 0), 0);
      const cajaChica = Number(state.cierres?.[state.local]?.cajaChica || 0);
      const efectivoFisico = Number(state.efectivo || 0);
      const qrAcreditado = Number(state.qr || 0);
      const totalVentaDia = totalVentasLocal;
      const ventaEfectivoPlanilla = totalVentaDia - pyBruto - qrAcreditado;
      const totalCobradoRegistrado = efectivoFisico + qrAcreditado;
      const efectivoAEntregar = ventaEfectivoPlanilla - totalEgresos + cajaChica;
      const totalPorMedios = efectivoFisico - cajaChica + totalEgresos + qrAcreditado + pyBruto;
      const totalRendidoHoja4 = totalPorMedios;
      const diferenciaEfectivoHoja4 = efectivoFisico - efectivoAEntregar;
      const diferenciaTotalMedios = totalPorMedios - totalVentaDia;

      return {
        totalVentasLocal,
        totalVentasPlanilla,
        totalProductosArmados,
        totalVentaDia,
        ventaEfectivoPlanilla,
        pyLista,
        pyManual,
        pyBruto,
        pyComision,
        pyNeto,
        totalEgresos,
        cajaChica,
        efectivoFisico,
        qrAcreditado,
        totalCobradoRegistrado,
        totalPorMedios,
        totalRendidoHoja4,
        diferenciaEfectivoHoja4,
        diferenciaTotalMedios,
        efectivoAEntregar
      };
    }

    function currentCierre() {
      if (!state.cierres[state.local]) {

    function cierreCalculos() {
      const data = resumen();
      const cierre = currentCierre();
      const cajaChica = Number(cierre.cajaChica || 0);
      const cajaFisicaReal = Number(data.efectivoFisico || 0);
      const efectivoSobrante = Number(cierre.efectivoSobrante || 0);
      const efectivoRendido = cajaFisicaReal;
      const efectivoEsperado = data.efectivoAEntregar;
      const diferenciaVentaEfectivo = cajaFisicaReal - data.efectivoAEntregar;
      const diferenciaCaja = diferenciaVentaEfectivo;
      return { ...data, cajaChica, cajaFisicaReal, efectivoSobrante, efectivoRendido, efectivoEsperado, diferenciaVentaEfectivo, diferenciaCaja };
    }

    function usoInventarioPorReceta(source = state) {
      const uso = {};
      const agregarProducto = (productoId, cantidad) => {
        const qty = Number(cantidad || 0);
        if (qty <= 0) return;
        const producto = productById(productoId);
        Object.entries(recetaProducto(producto)).forEach(([insumo, unidades]) => {
          uso[insumo] = Number(uso[insumo] || 0) + Number(unidades || 0) * qty;
        });
      };

      syncVentas(source.ventas).forEach((venta) => agregarProducto(venta.productoId, venta.cantidad));
      syncConsumosInternos(source.consumosInternos).forEach((row) => agregarProducto(row.productoId, row.cantidad));
      return uso;
    }

    function inventoryRows() {
      const usoRecetas = usoInventarioPorReceta(state);
      return stockGroups().flatMap(([grupo, rows]) =>
        rows.map((row) => {
          const inicial = Number(row.inicial || 0);
          const entrada = Number(row.entrada || 0);
          const final = inicial + entrada;
          const saldo = Number(row.saldo || 0);
          const salida = final - saldo;
          const salidaJustificada = Number(usoRecetas[row.producto] || 0);
          const diferencia = salida - salidaJustificada;
          return { grupo, producto: row.producto, inicial, entrada, final, salida, salidaJustificada, diferencia, saldo };
        })
      );
    }

    function inventarioResumen() {
      return inventoryRows().reduce(
        (acc, row) => {
          if (row.diferencia > 0) acc.faltante += row.diferencia;
          if (row.diferencia < 0) acc.sobrante += Math.abs(row.diferencia);
          acc.diferencia += row.diferencia;
          return acc;
        },
        { faltante: 0, sobrante: 0, diferencia: 0 }
      );
    }

    function inventarioResumenFromGroups(groups, source = {}) {
      const usoRecetas = usoInventarioPorReceta(source);
      return groups.flatMap(([, rows]) => rows || []).reduce(
        (acc, row) => {
          const inicial = Number(row.inicial || 0);
          const entrada = Number(row.entrada || 0);
          const saldo = Number(row.saldo || 0);
          const salida = inicial + entrada - saldo;
          const diferencia = salida - Number(usoRecetas[row.producto] || 0);
          if (diferencia > 0) acc.faltante += diferencia;
          if (diferencia < 0) acc.sobrante += Math.abs(diferencia);
          acc.diferencia += diferencia;
          return acc;
        },
        { faltante: 0, sobrante: 0, diferencia: 0 }
      );
    }

    function dailyStockGroups(dayData) {
      return [
        ["Carnes y panes", syncStockRows(dayData?.carnes, stockCarnesPanes)],
        ["Extras", syncStockRows(dayData?.extras, stockExtras)],
        ["Quesos", syncStockRows(dayData?.quesos, stockQuesos)],
        ["Jamones", syncStockRows(dayData?.jamones, stockJamones)],
        ["Bebidas", syncStockRows(dayData?.bebidas, stockBebidas)]
      ];
    }

    function resumenDailyData(dayData = {}) {
      const ventas = syncVentas(dayData.ventas);
      const productosArmados = syncProductosArmados(dayData.productosArmados);
      const pedidosYa = Array.isArray(dayData.pedidosYa) ? dayData.pedidosYa : [];
      const totalVentasPlanilla = ventas.reduce((acc, venta) => {
        const producto = productById(venta.productoId);
        return acc + producto.precio * Number(venta.cantidad || 0);
      }, 0);
      const totalProductosArmados = productosArmados.reduce((acc, row) => {
        return acc + Number(row.precio || 0) * Number(row.cantidad || 0);
      }, 0);
      const totalVentaDia = totalVentasPlanilla + totalProductosArmados;
      const pyLista = pedidosYa.reduce((acc, pedido) => {
        const producto = productById(pedido.productoId);
        return acc + producto.precio * Number(pedido.cantidad || 0);
      }, 0);
      const pyManual = Number(dayData.totalPYManual || 0);
      const pyBruto = pyManual > 0 ? pyManual : pyLista;
      const pyComision = 0;
      const pyNeto = pyBruto;
      const totalEgresos = (Array.isArray(dayData.egresos) ? dayData.egresos : zeroEgresos())
        .reduce((acc, egreso) => acc + Number(egreso.monto || 0), 0);
      const cajaChica = Number(dayData.cierre?.cajaChica || 0);
      const efectivoFisico = Number(dayData.efectivo || 0);
      const qrAcreditado = Number(dayData.qr || 0);
      const ventaEfectivoPlanilla = totalVentaDia - pyBruto - qrAcreditado;
      const efectivoAEntregar = ventaEfectivoPlanilla - totalEgresos + cajaChica;
      const totalPorMedios = efectivoFisico - cajaChica + totalEgresos + qrAcreditado + pyBruto;
      const diferenciaCaja = efectivoFisico - efectivoAEntregar;
      const diferenciaTotalMedios = totalPorMedios - totalVentaDia;
      return {
        totalVentaDia,
        ventaEfectivoPlanilla,
        cajaChica,
        efectivoAEntregar,
        efectivoFisico,
        qrAcreditado,
        pyBruto,
        pyComision,
        pyNeto,
        totalEgresos,
        totalPorMedios,
        diferenciaCaja,
        diferenciaTotalMedios
      };
    }

    function pagosPersonalFromEgresos(egresos = []) {

    function otrosEgresosFromEgresos(egresos = []) {

      state.reportesPorFecha[reportKey(report.local, report.fecha)] = report;

    function buildReportFromDaily(local, fecha, dayData, storedReport = null) {
      const daily = dayData || zeroDailyData(fecha);
      const data = resumenDailyData(daily);
      const egresos = Array.isArray(daily.egresos) ? daily.egresos : zeroEgresos();
      const inventario = inventarioResumenFromGroups(dailyStockGroups(daily), daily);
      const pagosPersonal = pagosPersonalFromEgresos(egresos);
      const otrosEgresos = otrosEgresosFromEgresos(egresos);
      const gananciaBruta50 = data.totalVentaDia * 0.5;
      const resultadoFinal = gananciaBruta50 - pagosPersonal;
      const hasData = Boolean(
        storedReport?.guardadoEn ||
        data.totalVentaDia ||
        data.totalPorMedios ||
        data.totalEgresos ||
        inventario.diferencia
      );
      return {
        ...defaultReporteSucursal(local),
        ...(storedReport || {}),
        local,
        fecha,
        guardadoEn: storedReport?.guardadoEn || (hasData ? "En carga" : ""),
        encargado: storedReport?.encargado || daily.encargado || "",
        ventaTotal: data.totalVentaDia,
        ventaEfectivoPlanilla: data.ventaEfectivoPlanilla,
        totalEgresos: data.totalEgresos,
        cajaChica: data.cajaChica,
        efectivoAEntregar: data.efectivoAEntregar,
        totalEfectivoCaja: data.efectivoFisico,
        qrAcreditado: data.qrAcreditado,
        pedidosYaBruto: data.pyBruto,
        pedidosYaNeto: data.pyBruto,
        pyComision: 0,
        totalPorMedios: data.totalPorMedios,
        diferenciaMedios: data.diferenciaTotalMedios,
        gananciaBruta50,
        pagosPersonal,
        otrosEgresos,
        resultadoFinal,
        diferenciaCaja: data.diferenciaCaja,
        inventarioFaltante: inventario.faltante,
        inventarioSobrante: inventario.sobrante,
        inventarioDiferencia: inventario.diferencia,
        estado: hasData ? (resultadoFinal >= 0 ? "Ganancia" : "Perdida") : "Sin cierre"
      };
    }

    function adminReportRows(fecha = state.fecha) {
      return locales.map((local) => {
        const key = reportKey(local, fecha);
        const report = state.reportesPorFecha?.[key];
        const legacy = state.reportesSucursales?.[local];
        if (local === state.local && fecha === state.fecha) return buildSucursalReport();
        if (state.sucursalDias?.[key]) return buildReportFromDaily(local, fecha, state.sucursalDias[key], report);
        if (report) return { ...defaultReporteSucursal(local), ...report };
        if (legacy?.fecha === fecha) return { ...defaultReporteSucursal(local), ...legacy };
        return { ...defaultReporteSucursal(local), fecha };
      });
    }

    function activeAdminReports(fecha = state.fecha) {
      return adminReportRows(fecha).filter((row) => row.guardadoEn && row.fecha === fecha);
    }

    function parseIsoDate(value) {
      const [year, month, day] = String(value || today()).split("-").map(Number);
      return new Date(year || 2000, Math.max(0, (month || 1) - 1), day || 1, 12, 0, 0);
    }

    function isoDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function adminRangeDates() {
      const from = parseIsoDate(adminFechaDesde || state.fecha);
      const to = parseIsoDate(adminFechaHasta || adminFechaDesde || state.fecha);
      const start = from <= to ? from : to;
      const end = from <= to ? to : from;
      const dates = [];
      const cursor = new Date(start);
      while (cursor <= end && dates.length < 1100) {
        dates.push(isoDate(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }
      return dates;
    }

    function adminRangeLabel() {
      const dates = adminRangeDates();
      if (!dates.length) return state.fecha;
      return dates.length === 1 ? dates[0] : `${dates[0]} al ${dates[dates.length - 1]}`;
    }

    function setAdminRangePreset(preset) {
      const reference = parseIsoDate(state.fecha || today());
      let from = new Date(reference);
      let to = new Date(reference);

      if (preset === "semana") {
        const weekday = reference.getDay() || 7;
        from.setDate(reference.getDate() - weekday + 1);
        to = new Date(from);
        to.setDate(from.getDate() + 6);
      }
      if (preset === "mes") {
        from = new Date(reference.getFullYear(), reference.getMonth(), 1, 12);
        to = new Date(reference.getFullYear(), reference.getMonth() + 1, 0, 12);
      }
      if (preset === "trimestre") {
        const firstMonth = Math.floor(reference.getMonth() / 3) * 3;
        from = new Date(reference.getFullYear(), firstMonth, 1, 12);
        to = new Date(reference.getFullYear(), firstMonth + 3, 0, 12);
      }

      adminPeriodo = preset;
      adminFechaDesde = isoDate(from);
      adminFechaHasta = isoDate(to);
    }

    function adminReportRowsForRange() {
      return adminRangeDates().flatMap((fecha) => adminReportRows(fecha));
    }

    function activeAdminReportsForRange() {
      return adminReportRowsForRange().filter((row) => row.guardadoEn && row.estado !== "Sin cierre");
    }

    function aggregateAdminReportsByLocal(reports) {
      return locales.map((local) => {
        const rows = reports.filter((row) => row.local === local);
        const totals = adminTotals(rows);
        return {
          ...defaultReporteSucursal(local),
          ...totals,
          local,
          fecha: adminRangeLabel(),
          diasConDatos: rows.length,
          guardadoEn: rows.length ? "Periodo" : "",
          estado: rows.length ? (totals.resultadoFinal >= 0 ? "Ganancia" : "Perdida") : "Sin datos"
        };
      }).filter((row) => row.diasConDatos > 0);
    }

    function adminTotals(reports) {
      return reports.reduce(
        (acc, row) => {
          acc.ventaTotal += Number(row.ventaTotal || 0);
          acc.ventaEfectivoPlanilla += Number(row.ventaEfectivoPlanilla || 0);
          acc.totalEgresos += Number(row.totalEgresos || 0);
          acc.cajaChica += Number(row.cajaChica || 0);
          acc.efectivoAEntregar += Number(row.efectivoAEntregar || 0);
          acc.totalEfectivoCaja += Number(row.totalEfectivoCaja || 0);
          acc.qrAcreditado += Number(row.qrAcreditado || 0);
          acc.pedidosYaBruto += Number(row.pedidosYaBruto || 0);
          acc.pedidosYaNeto += Number(row.pedidosYaBruto || 0);
          acc.pyComision += 0;
          acc.totalPorMedios += Number(row.totalPorMedios || 0);
          acc.diferenciaMedios += Number(row.diferenciaMedios || 0);
          acc.gananciaBruta50 += Number(row.gananciaBruta50 || 0);
          acc.pagosPersonal += Number(row.pagosPersonal || 0);
          acc.resultadoFinal += Number(row.resultadoFinal || 0);
          acc.diferenciaCaja += Number(row.diferenciaCaja || 0);
          acc.inventarioFaltante += Number(row.inventarioFaltante || 0);
          acc.inventarioSobrante += Number(row.inventarioSobrante || 0);
          acc.inventarioDiferencia += Number(row.inventarioDiferencia || 0);
          return acc;
        },
        {
          ventaTotal: 0,
          ventaEfectivoPlanilla: 0,
          totalEgresos: 0,
          cajaChica: 0,
          efectivoAEntregar: 0,
          totalEfectivoCaja: 0,
          qrAcreditado: 0,
          pedidosYaBruto: 0,
          pedidosYaNeto: 0,
          pyComision: 0,
          totalPorMedios: 0,
          diferenciaMedios: 0,
          gananciaBruta50: 0,
          pagosPersonal: 0,
          resultadoFinal: 0,
          diferenciaCaja: 0,
          inventarioFaltante: 0,
          inventarioSobrante: 0,
          inventarioDiferencia: 0
        }
      );
    }

    function downloadCsv(filename, rows) {
      const csv = `\ufeff${rows.map((row) => row.map(csvCell).join(";")).join("\n")}`;
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

    function downloadJson(filename, payload) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;

      link.remove();

    }

    function importBackupFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(String(reader.result || "{}"));
          const imported = payload?.state || payload;
          if (!imported || typeof imported !== "object" || (!imported.sucursalDias && !imported.cierres)) {
            throw new Error("El archivo no parece ser un respaldo de la planilla Bartolo.");
          }
          const ok = confirm("Esto reemplazara los datos de esta tablet/navegador por el respaldo seleccionado. Continuar?");
          if (!ok) return;
          state = normalizeState({ ...defaultState(), ...imported });
          state.acceso = defaultAcceso();
          activeTab = "menu";
          saveState();
          render();
          alert("Respaldo importado. Inicia sesion nuevamente para seguir trabajando.");
        } catch (error) {
          alert(`No se pudo importar el respaldo: ${error.message}`);
        }
      };
      reader.readAsText(file, "utf-8");
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return `"${text.replaceAll('"', '""')}"`;
    }

      const pdf = lines && lines.type ? buildVisualPdf(lines) : buildSimplePdf(lines);
      const blob = new Blob([pdf], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function buildVisualPdf(report) {
      const pageWidth = 595;
      const pageHeight = 842;
      const margin = 36;
      const colors = {
        dark: [0.07, 0.07, 0.07],
        ink: [0.08, 0.08, 0.08],
        muted: [0.42, 0.42, 0.42],
        line: [0.84, 0.86, 0.89],
        white: [1, 1, 1],
        soft: [0.96, 0.97, 0.98],
        orange: [0.95, 0.49, 0.08],
        blue: [0.10, 0.28, 0.62],
        green: [0.08, 0.44, 0.22],
        red: [0.74, 0.10, 0.10],
        amber: [0.75, 0.42, 0.04]
      };
      const pageBottom = pageHeight - 44;
      const pages = [];
      let commands = [];
      let y = margin;

      const rgb = (color) => color.map((value) => Number(value).toFixed(3)).join(" ");
      const toneColor = (tone) => {
        if (tone === "ok") return colors.green;
        if (tone === "alert") return colors.red;
        if (tone === "blue") return colors.blue;
        if (tone === "green") return colors.green;
        if (tone === "amber") return colors.amber;
        return colors.dark;
      };
      const pushPage = () => {
        if (commands.length) pages.push(commands.join("\n"));
        commands = [];
      };
      const rect = (x, top, width, height, fill, stroke) => {
        const bottom = pageHeight - top - height;
        if (fill && stroke) {
          commands.push(`q ${rgb(fill)} rg ${rgb(stroke)} RG ${x} ${bottom} ${width} ${height} re B Q`);
          return;
        }
        if (fill) commands.push(`q ${rgb(fill)} rg ${x} ${bottom} ${width} ${height} re f Q`);
        if (stroke) commands.push(`q ${rgb(stroke)} RG 0.8 w ${x} ${bottom} ${width} ${height} re S Q`);
      };
      const line = (x1, top1, x2, top2, color = colors.line) => {
        commands.push(`q ${rgb(color)} RG 0.7 w ${x1} ${pageHeight - top1} m ${x2} ${pageHeight - top2} l S Q`);
      };
      const text = (x, top, value, options = {}) => {
        const size = options.size || 10;
        const font = options.font || "F1";
        const color = options.color || colors.ink;
        const safe = escapePdfText(pdfSafeText(value));
        commands.push(`BT /${font} ${size} Tf ${rgb(color)} rg 1 0 0 1 ${x} ${pageHeight - top - size} Tm (${safe}) Tj ET`);
      };
      const wrapVisualText = (value, width, size) => {
        const maxLength = Math.max(8, Math.floor(width / (size * 0.53)));
        return wrapPdfLine(pdfSafeText(value), maxLength);
      };
      const wrappedText = (x, top, value, width, options = {}) => {
        const size = options.size || 10;
        const lineHeight = options.lineHeight || size + 4;
        const lines = wrapVisualText(value, width, size);
        lines.forEach((row, index) => text(x, top + index * lineHeight, row, options));
        return top + lines.length * lineHeight;
      };
      const ensureSpace = (height) => {
        if (y + height <= pageBottom) return;
        pushPage();
        rect(0, 0, pageWidth, 48, colors.dark);
        text(margin, 15, "BARTOLO JUNIOR", { font: "F2", size: 15, color: colors.white });
        text(pageWidth - 180, 17, "continuacion de informe", { size: 10, color: colors.orange });
        y = 66;
      };
      const shortText = (value, length) => {
        const safe = pdfSafeText(value).replace(/\s+/g, " ").trim();
        return safe.length > length ? `${safe.slice(0, length - 3)}...` : safe;
      };
      const drawCard = (x, top, width, height, card) => {
        const bg = toneColor(card.tone);
        rect(x, top, width, height, bg);
        text(x + 12, top + 12, String(card.label || "").toUpperCase(), { font: "F2", size: 8, color: colors.white });
        wrappedText(x + 12, top + 32, card.value, width - 24, { font: "F2", size: 14, lineHeight: 16, color: colors.white });
      };
      const drawCards = (cards) => {
        const gap = 10;
        const perRow = 4;
        const width = (pageWidth - margin * 2 - gap * (perRow - 1)) / perRow;
        for (let index = 0; index < cards.length; index += perRow) {
          const rowCards = cards.slice(index, index + perRow);
          ensureSpace(88);
          rowCards.forEach((card, rowIndex) => {
            drawCard(margin + rowIndex * (width + gap), y, width, 76, card);
          });
          y += 94;
        }
      };
      const drawSection = (section) => {
        const noteLines = section.note ? wrapVisualText(section.note, pageWidth - margin * 2 - 24, 9) : [];
        const height = 38 + section.rows.length * 24 + noteLines.length * 13 + (noteLines.length ? 16 : 0);
        ensureSpace(height + 10);
        const start = y;
        rect(margin, y, pageWidth - margin * 2, height, colors.white, colors.line);
        rect(margin, y, pageWidth - margin * 2, 28, colors.soft);
        text(margin + 12, y + 9, section.title, { font: "F2", size: 12, color: colors.ink });
        y += 38;
        section.rows.forEach(([label, value]) => {
          text(margin + 12, y + 4, label, { size: 10, color: colors.ink });
          text(pageWidth - margin - 150, y + 4, value, { font: "F2", size: 10, color: colors.ink });
          line(margin + 12, y + 21, pageWidth - margin - 12, y + 21);
          y += 24;
        });
        if (noteLines.length) {
          y += 4;
          noteLines.forEach((row) => {
            text(margin + 12, y, row, { font: "F2", size: 9, color: colors.amber });
            y += 13;
          });
        }
        y = start + height + 16;
      };
      const drawArmados = (items) => {
        if (!items.length) return;
        drawSection({
          title: "Productos armados por cliente",
          rows: items.map((item) => [`${item.producto} | ${item.detalle}`, item.total])
        });
      };
      const drawAdminDetail = (rows) => {
        if (!rows?.length) return;
        ensureSpace(72);
        text(margin, y, report.detailTitle || "Detalle", { font: "F2", size: 14, color: colors.ink });
        y += 24;
        rect(margin, y, pageWidth - margin * 2, 24, colors.dark);
        text(margin + 8, y + 8, "Sucursal", { font: "F2", size: 7, color: colors.white });

            text(270, y + 6, "Inicial", { font: "F2", size: 7, color: colors.muted });
            text(312, y + 6, "Entrada", { font: "F2", size: 7, color: colors.muted });
            text(358, y + 6, "Real", { font: "F2", size: 7, color: colors.muted });
            text(400, y + 6, "Receta", { font: "F2", size: 7, color: colors.muted });
            text(448, y + 6, "Dif.", { font: "F2", size: 7, color: colors.muted });
            text(490, y + 6, "Saldo", { font: "F2", size: 7, color: colors.muted });
            y += 22;
          }
          ensureSpace(24);
          text(margin + 8, y + 5, shortText(row.producto, 34), { size: 8, color: colors.ink });
          text(278, y + 5, String(row.inicial), { size: 7, color: colors.ink });
          text(322, y + 5, String(row.entrada), { size: 7, color: colors.ink });
          text(366, y + 5, String(row.salida), { size: 7, color: colors.ink });
          text(410, y + 5, String(row.salidaJustificada || 0), { size: 7, color: colors.ink });
          text(454, y + 5, String(row.diferencia || 0), { font: "F2", size: 7, color: row.diferencia ? colors.red : colors.ink });
          text(498, y + 5, String(row.saldo), { font: "F2", size: 7, color: colors.ink });
          line(margin, y + 19, pageWidth - margin, y + 19);
          y += 20;
        });
        y += 12;
      };
      const drawFooter = () => {
        ensureSpace(70);
        report.footer.forEach((row) => {
          text(margin, y, row, { font: "F2", size: 10, color: colors.ink });

      };

      rect(0, 0, pageWidth, 126, colors.dark);
      text(margin, 26, report.title, { font: "F2", size: 27, color: colors.white });
      text(margin, 58, report.subtitle.toUpperCase(), { font: "F2", size: 12, color: colors.orange });
      report.meta.slice(0, 6).forEach((row, index) => {
        text(330, 22 + index * 15, row, { size: 9, color: colors.white });
      });
      rect(0, 118, pageWidth, 8, colors.orange);
      y = 146;
      drawCards(report.cards);
      drawSection({
        title: report.status.label,
        rows: [[report.status.rowLabel || "Estado", report.status.value]],
        note: report.status.note || (report.status.tone === "ok" ? "Caja sin diferencia segun los datos cargados." : "Revisar conteo, gastos y responsable antes de firmar.")
      });
      report.sections.forEach(drawSection);
      drawArmados(report.armados || []);
      drawAdminDetail(report.detailRows || []);
      if (report.inventorySummary && report.inventoryRows) drawInventory();
      drawFooter();
      pushPage();
      return buildPdfDocumentFromPages(pages);
    }

    function buildPdfDocumentFromPages(pageContents) {
      const pageWidth = 595;
      const pageHeight = 842;
      const fontRegularId = 3 + pageContents.length * 2;
      const fontBoldId = fontRegularId + 1;
      const fontMonoId = fontRegularId + 2;
      const objects = [];
      const pageIds = pageContents.map((_, index) => 3 + index * 2);
      objects.push("<< /Type /Catalog /Pages 2 0 R >>");
      objects.push(`<< /Type /Pages /Kids [${pageIds.map((id) => `${id} 0 R`).join(" ")}] /Count ${pageContents.length} >>`);
      pageContents.forEach((content, index) => {
        const pageId = 3 + index * 2;
        const contentId = pageId + 1;
        objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /Font << /F1 ${fontRegularId} 0 R /F2 ${fontBoldId} 0 R /F3 ${fontMonoId} 0 R >> >> /Contents ${contentId} 0 R >>`);
        objects.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      });
      objects.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
      objects.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>");
      objects.push("<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>");
      return buildPdfBody(objects);
    }

    function buildPdfBody(objects) {
      let body = "%PDF-1.4\n";
      const offsets = [0];
      objects.forEach((object, index) => {
        offsets.push(body.length);
        body += `${index + 1} 0 obj\n${object}\nendobj\n`;
      });

      const xrefStart = body.length;
      body += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
      offsets.slice(1).forEach((offset) => {
        body += `${String(offset).padStart(10, "0")} 00000 n \n`;
      });
      body += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
      return body;
    }

    function buildSimplePdf(lines) {
      const pageWidth = 595;
      const pageHeight = 842;
      const margin = 40;
      const lineHeight = 14;
      const maxLines = 52;
      const pages = [];
      let current = [];

      lines.flatMap((line) => wrapPdfLine(pdfSafeText(line), 90)).forEach((line) => {
        if (current.length >= maxLines) {
          pages.push(current);
          current = [];
        }
        current.push(line);
      });
      if (current.length) pages.push(current);

      const fontId = 3 + pages.length * 2;
      const objects = [];
      const pageIds = pages.map((_, index) => 3 + index * 2);
      objects.push("<< /Type /Catalog /Pages 2 0 R >>");
      objects.push(`<< /Type /Pages /Kids [${pageIds.map((id) => `${id} 0 R`).join(" ")}] /Count ${pages.length} >>`);

      pages.forEach((pageLines, index) => {
        const pageId = 3 + index * 2;
        const contentId = pageId + 1;
        const content = [
          "BT",
          "/F1 10 Tf",
          "12 TL",
          ...pageLines.map((line, lineIndex) => {
            const y = pageHeight - margin - lineIndex * lineHeight;
            return `1 0 0 1 ${margin} ${y} Tm (${escapePdfText(line)}) Tj`;
          }),
          "ET"
        ].join("\n");
        objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /Font << /F1 ${fontId} 0 R >> >> /Contents ${contentId} 0 R >>`);
        objects.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      });

      objects.push("<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>");

      return buildPdfBody(objects);
    }

    function pdfSafeText(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\x20-\x7E]/g, " ");
    }

    function escapePdfText(value) {
      return String(value).replaceAll("\\", "\\\\").replaceAll("(", "\\(").replaceAll(")", "\\)");
    }

    function wrapPdfLine(value, maxLength) {
      const text = String(value);
      if (text.length <= maxLength) return [text];
      const words = text.split(" ");
      const lines = [];
      let line = "";
      words.forEach((word) => {
        const next = line ? `${line} ${word}` : word;
        if (next.length > maxLength) {
          if (line) lines.push(line);
          line = word;
        } else {
          line = next;
        }
      });
      if (line) lines.push(line);
      return lines;
    }

    function slugText(value) {
      return pdfSafeText(value).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "sucursal";
    }

    root.addEventListener("click", (event) => {
      const exportBackupButton = event.target.closest("[data-action='export-backup']");
      if (exportBackupButton) {
        exportBackup();
        return;
      }

      const importBackupButton = event.target.closest("[data-action='import-backup']");
      if (importBackupButton) {
        root.querySelector("[data-backup-input]")?.click();
        return;
      }

      const logout = event.target.closest("[data-action='logout']");
      if (logout) {
        state.acceso = defaultAcceso();
        saveState();
        render();
        return;
      }

      const loginAdmin = event.target.closest("[data-action='login-admin']");
      if (loginAdmin) {
        const pin = root.querySelector("[data-login-admin-pin]")?.value?.trim() || "";
        if (pin !== String(state.seguridad.adminPin || "").trim()) {
          alert("PIN Admin incorrecto.");
          return;
        }
        state.acceso = { tipo: "admin", local: "", nombre: "Administrador" };
        activeTab = "menu";
        saveState();
        render();
        return;
      }

      const loginEncargado = event.target.closest("[data-action='login-encargado']");
      if (loginEncargado) {
        const pin = root.querySelector("[data-login-pin]")?.value?.trim() || "";
        const local = findSucursalByPin(pin);
        if (!local) {
          alert("PIN de encargado incorrecto o inactivo.");
          return;
        }
        const config = state.seguridad.sucursales[local] || {};
        persistCurrentDay();
        state.local = local;
        loadCurrentDay();
        state.acceso = { tipo: "encargado", local, nombre: config.encargado || "Encargado" };
        state.encargado = config.encargado || state.encargado;
        activeTab = "menu";
        saveState();
        render();
        return;
      }

      const generatePin = event.target.closest("[data-action='generate-pin']");
      if (generatePin) {
        const local = locales[Number(generatePin.dataset.securityIndex)];
        if (local && state.seguridad.sucursales[local]) {
          state.seguridad.sucursales[local].pin = randomPin();
          saveState();
          render();
        }
        return;
      }

      const tab = event.target.closest("[data-tab]");
      if (tab) {
        if (tab.dataset.tab === "admin" && !isAdminAccess()) return;
        activeTab = tab.dataset.tab;
        render();
        return;
      }

      const adminPreset = event.target.closest("[data-admin-preset]");
      if (adminPreset) {
        setAdminRangePreset(adminPreset.dataset.adminPreset);
        render();
        return;
      }

      const saleCategory = event.target.closest("[data-sale-category]");
      if (saleCategory) {
        activeVentaCategoria = saleCategory.dataset.saleCategory;
        render();
        return;
      }

      const addPy = event.target.closest("[data-action='add-py']");
      if (addPy) {
        state.pedidosYa.push({
          nro: `PY-${String(state.pedidosYa.length + 1).padStart(3, "0")}`,
          productoId: "15",
          cantidad: 1
        });
        saveState();
        render();
        return;
      }

      const closePdf = event.target.closest("[data-action='close-pdf']");
      if (closePdf) {
        cerrarSucursalPdf();
        saveState();
        render();
        return;
      }

      const inventoryCsv = event.target.closest("[data-action='inventory-csv']");
      if (inventoryCsv) {
        downloadInventoryCsv();
        return;
      }

      const saveAdminSummary = event.target.closest("[data-action='save-admin-summary']");
      if (saveAdminSummary) {
        guardarResumenSucursal();
        saveState();
        render();
        return;
      }

      const adminPdf = event.target.closest("[data-action='admin-pdf']");
      if (adminPdf) {
        guardarResumenSucursal();
        saveState();
        downloadAdminPdf();
        render();
        return;
      }

      const deletePy = event.target.closest("[data-delete-py]");
      if (deletePy) {
        state.pedidosYa.splice(Number(deletePy.dataset.deletePy), 1);
        saveState();
        render();
      }
    });

    root.addEventListener("change", (event) => {
      const target = event.target;
      const field = target.dataset.field;

      if (target.dataset.adminRange) {
        adminPeriodo = "personalizado";
        if (target.dataset.adminRange === "desde") adminFechaDesde = target.value || state.fecha;
        if (target.dataset.adminRange === "hasta") adminFechaHasta = target.value || state.fecha;
        render();
        return;
      }

      if (target.dataset.backupInput !== undefined) {
        importBackupFile(target.files?.[0]);
        target.value = "";
        return;
      }

      if (field === "fecha" || field === "local") {
        if (field === "local" && !isAdminAccess()) {
          render();
          return;
        }
        changeDayContext(field, target.value);
        return;
      }

      if (target.dataset.securityAdminPin !== undefined) {
        state.seguridad.adminPin = target.value;
        saveState();
        return;
      }

      if (target.dataset.securityIndex !== undefined && target.dataset.securityField) {
        const local = locales[Number(target.dataset.securityIndex)];
        const securityField = target.dataset.securityField;
        if (local && state.seguridad.sucursales[local]) {
          state.seguridad.sucursales[local][securityField] = target.type === "checkbox" ? target.checked : target.value;
          saveState();
        }
        return;
      }

      if (target.dataset.stock) {
        const row = state[target.dataset.stock][Number(target.dataset.index)];
        row[field] = toNumber(target.value);
        saveState();
        render();
        return;
      }

      if (target.dataset.venta) {
        const index = Number(target.dataset.venta);
        state.ventas[index].cantidad = toNumber(target.value);
        saveState();
        render();
        return;
      }

      if (target.dataset.armado) {
        const row = state.productosArmados[Number(target.dataset.armado)];
        row[field] = field === "nombre" ? target.value : toNumber(target.value);
        saveState();
        render();
        return;
      }

      if (target.dataset.consumo !== undefined) {
        const row = state.consumosInternos[Number(target.dataset.consumo)];
        row[field] = field === "cantidad" ? toNumber(target.value) : target.value;
        saveState();
        render();
        return;
      }

      if (target.dataset.py) {
        const row = state.pedidosYa[Number(target.dataset.py)];
        row[field] = field === "cantidad" ? toNumber(target.value) : target.value;
        saveState();
        render();
        return;
      }

      if (target.dataset.egreso) {
        const row = state.egresos[Number(target.dataset.egreso)];
        row[field] = field === "monto" ? toNumber(target.value) : target.value;
        saveState();
        render();
        return;
      }

      if (target.dataset.cierreField) {
        const cierre = currentCierre();
        const cierreField = target.dataset.cierreField;
        cierre[cierreField] = target.type === "number" ? toNumber(target.value) : target.value;
        saveState();
        render();
        return;
      }

      if (field) {
        state[field] = target.type === "number" ? toNumber(target.value) : target.value;
        saveState();
        render();
      }
    });

    if (typeof navigator !== "undefined" && "serviceWorker" in navigator && typeof window !== "undefined" && window.isSecureContext) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    render();
    loadCloudState();
  </script>
</body>
